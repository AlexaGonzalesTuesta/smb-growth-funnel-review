name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit and pipeline tests
        run: python -m pytest -q
      - name: Evaluation suite (fails the build if a check fails)
        run: python -m evals.run_evals
      - name: Site data matches a fresh rebuild
        run: |
          cp site/data.json "$RUNNER_TEMP/committed.json"
          python -m growth.build
          python scripts/check_site_data.py "$RUNNER_TEMP/committed.json" site/data.json
